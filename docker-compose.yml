version: 3.8 
services: 
  postgres: 
    image: postgres:17 
    container_name: cs2-openworld-postgres 
    environment: 
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD:  
      POSTGRES_DB: postgres 
    ports: 
      - \" ":5432:5432\ 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
  redis: 
    image: redis:7-alpine 
    container_name: cs2-openworld-redis 
    command: redis-server --requirepass  
    ports: 
      - \" ":6379:6379\ 
    volumes: 
      - redis_data:/data 
volumes: 
  postgres_data: 
  redis_data: 
