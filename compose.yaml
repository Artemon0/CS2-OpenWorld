services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OW_PG_ADMIN_PASSWORD:?Set OW_PG_ADMIN_PASSWORD in .env}
    ports:
      - "${OW_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - openworld-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      OW_REDIS_PASSWORD: ${OW_REDIS_PASSWORD:?Set OW_REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$OW_REDIS_PASSWORD"
    ports:
      - "${OW_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - openworld-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$OW_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  openworld-postgres:
  openworld-redis:
